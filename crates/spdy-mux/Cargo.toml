[package]
name = "spdy-mux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "SPDY/3.1 stream multiplexer over WebSocket transports"
keywords = ["spdy", "multiplexer", "websocket", "async", "tokio"]
categories = ["network-programming", "asynchronous"]
autoexamples = false

[dependencies]
bytes = { workspace = true }
flate2 = { workspace = true, features = ["zlib-rs"] }
fastwebsockets = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
kube-runtime = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "k8s_raw_spdy"
path = "examples/k8s_raw_spdy.rs"

[[example]]
name = "k8s_websocket_over_spdy"
path = "examples/k8s_websocket_over_spdy.rs"

[lints]
workspace = true
