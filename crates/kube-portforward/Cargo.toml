[package]
name = "kube-portforward"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Kubernetes port-forward over SPDY/3.1 with kubectl-style WebSocket with raw fallback"
keywords = ["kubernetes", "portforward", "spdy", "async", "tokio"]
categories = ["network-programming", "asynchronous"]
autoexamples = false

[dependencies]
arc-swap = { workspace = true }
base64 = { workspace = true }
crossbeam-queue = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true }
kube-runtime = { workspace = true }
quanta = { workspace = true }
rand = { workspace = true }
spdy-mux = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
default = []

[dev-dependencies]
anyhow = { workspace = true }
k8s-openapi = { workspace = true }
kube-runtime = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "portforward"
path = "examples/portforward.rs"

[lints]
workspace = true
