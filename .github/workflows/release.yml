name: Release

on:
  push:
    tags:
      - 'spdy-mux-v*'
      - 'kube-portforward-v*'
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        required: true
        type: choice
        options:
          - spdy-mux
          - kube-portforward

permissions:
  contents: write

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: nightly
      - name: Determine crate
        id: which
        env:
          SELECTED_CRATE: ${{ inputs.crate }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "crate=$SELECTED_CRATE" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == spdy-mux-v* ]]; then
            echo "crate=spdy-mux" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == kube-portforward-v* ]]; then
            echo "crate=kube-portforward" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised ref $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # Both tags are pushed together and each starts its own run, so the
      # kube-portforward run can reach the index before spdy-mux has been
      # published to it. Publishing is not retried automatically, so without
      # this the release simply fails.
      - name: Wait for spdy-mux on the index
        if: steps.which.outputs.crate == 'kube-portforward'
        run: |
          set -euo pipefail
          want=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kube-portforward")
                     | .dependencies[] | select(.name == "spdy-mux") | .req' \
            | tr -d '^=~ ')
          echo "kube-portforward requires spdy-mux $want"
          url="https://index.crates.io/sp/dy/spdy-mux"
          for _ in $(seq 1 60); do
            # The sparse index is newline-delimited JSON, so the whole
            # response is slurped before asking whether the version is there.
            if curl -sf "$url" | jq -e -s --arg want "$want" \
                 'any(.[]; .vers == $want)' >/dev/null; then
              echo "spdy-mux $want is on the index"
              exit 0
            fi
            sleep 10
          done
          echo "spdy-mux $want never appeared on the index" >&2
          exit 1
      - name: cargo publish --dry-run
        env:
          CRATE: ${{ steps.which.outputs.crate }}
        run: cargo publish --dry-run -p "$CRATE" --locked
      - name: cargo publish
        run: cargo publish -p "$CRATE" --locked
        env:
          CRATE: ${{ steps.which.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CRATE: ${{ steps.which.outputs.crate }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$CRATE $GITHUB_REF_NAME" --generate-notes
