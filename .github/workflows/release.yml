name: Release

on:
  push:
    tags:
      - 'spdy-mux-v*'
      - 'kube-portforward-v*'
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish'
        required: true
        type: choice
        options:
          - spdy-mux
          - kube-portforward

permissions:
  contents: write

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          toolchain: nightly
      - uses: swatinem/rust-cache@5e4a76743357a1c3c57315bc1896d2c7f89d6861
        with:
          shared-key: release
      - name: Determine crate
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "crate=${{ inputs.crate }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == spdy-mux-v* ]]; then
            echo "crate=spdy-mux" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == kube-portforward-v* ]]; then
            echo "crate=kube-portforward" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognised ref ${{ github.ref_name }}" >&2
            exit 1
          fi
      - name: cargo publish --dry-run
        run: cargo publish --dry-run -p ${{ steps.which.outputs.crate }} --locked
      - name: cargo publish
        run: cargo publish -p ${{ steps.which.outputs.crate }} --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.which.outputs.crate }} ${{ github.ref_name }}
          generate_release_notes: true
